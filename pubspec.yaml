name: dream_ai
description: "Dream AI – Face Analyzer & Daily Fun Predictions. An entertainment-only app for fun face insights and daily predictions."
publish_to: "none"

# App version. Format: <semantic-version>+<build-number>
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Firebase
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.6

  # Monetization
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0

  # On-device face detection (ML Kit) — runs locally, no network, entertainment use only
  google_mlkit_face_detection: ^0.12.0
  image_picker: ^1.1.2
  image: ^4.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Privacy / compliance
  permission_handler: ^11.3.1
  app_tracking_transparency: ^2.0.6

  # Sharing & growth
  share_plus: ^10.1.2
  screenshot: ^3.0.0
  in_app_review: ^2.0.10

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # enables flutter gen-l10n from lib/l10n/*.arb

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  # Display/body fonts are loaded at runtime via the `google_fonts` package
  # (see lib/core/theme/app_typography.dart), so no font binaries are bundled.
  # To ship fonts offline instead, download them into assets/fonts/ and declare
  # a `fonts:` section here.
