name: Build Android APK

# Builds an installable APK in the cloud and uploads it as an artifact you can
# download from the run's "Artifacts" section. No local setup required.
on:
  workflow_dispatch: {}          # lets you run it manually from the Actions tab
  push:
    branches:
      - claude/vibrant-mccarthy-xqjzfe

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned for compatibility with this project's Gradle/AGP config.
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Backfill the binary/boilerplate platform pieces (Gradle wrapper, launcher
      # icons, etc.) WITHOUT overwriting the committed manifest/Gradle/Kotlin.
      - name: Generate Android scaffolding
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      # Debug APK = always installable, no signing keys or R8 needed. Best for testing.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dream-ai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Optimized release APK (debug-signed via the fallback in app/build.gradle
      # since no keystore is configured). Best-effort — won't fail the job.
      - name: Build release APK (best effort)
        id: release
        continue-on-error: true
        run: flutter build apk --release

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dream-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
